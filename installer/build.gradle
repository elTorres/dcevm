import java.nio.file.FileVisitResult
import java.nio.file.Files
import java.nio.file.Path
import java.nio.file.Paths
import java.nio.file.SimpleFileVisitor
import java.nio.file.StandardCopyOption
import java.nio.file.attribute.BasicFileAttributes

apply plugin: 'java'
apply plugin: 'idea'

jar {
    if (project.hasProperty('installerJarName')) {
        archiveName = installerJarName
    }
    manifest {
        attributes("Main-Class": "com.github.dcevm.installer.Main")
    }
}

project.ext {
    processedData = Paths.get("$buildDir/data")
    // Should be populated by build server from the DCEVM upstream job
    dataSource = Paths.get("$buildDir/rawdata")
}

sourceSets {
    main {
        output.dir(processedData.toFile(), builtBy: 'copyData')
    }
}

// -PuseLocalBuild: bundle the product DCEVM compiled locally (:hotspot:compileProduct) for the current
// platform instead of the build server data. The resource path is the one the installer looks up:
// <os>_<arch>_<compiler>/product/<library> (ConfigurationInfo resource path + Installer.installClientServer).
def useLocalBuild = project.hasProperty('useLocalBuild')
def localLibraryName = rootProject.os.name() == 'WINDOWS' ? 'jvm.dll' : (rootProject.os.name() == 'MAC' ? 'libjvm.dylib' : 'libjvm.so')
def localLibrary = new File(rootProject.project(':hotspot').projectDir, "build/product/${localLibraryName}")
def localResource = "${rootProject.os.buildPath}_${rootProject.arch.buildArch}_${rootProject.compiler}/product/${localLibraryName}"

task copyData {
    onlyIf { useLocalBuild || Files.exists(dataSource) }
    doLast {
        Files.createDirectories(processedData)
        if (useLocalBuild) {
            if (!localLibrary.isFile()) {
                throw new GradleException("No hay DCEVM product compilado (${localLibrary}): ejecuta :hotspot:compileProduct")
            }
            def target = processedData.resolve(localResource)
            Files.createDirectories(target.parent)
            Files.copy(localLibrary.toPath(), target, StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("Bundling ${localLibrary} as ${localResource}")
        } else {
            Files.walkFileTree(dataSource, new CopyDataVisitor(project));
        }
    }
}

// With -PuseLocalBuild, check that the jar really contains the local DCEVM
task checkLocalData(dependsOn: jar) {
    onlyIf { useLocalBuild }
    doLast {
        def zip = new java.util.zip.ZipFile(jar.archivePath)
        try {
            def entry = zip.getEntry(localResource)
            if (entry == null || entry.size != localLibrary.length()) {
                throw new GradleException("${jar.archivePath.name} does not contain ${localResource} (${localLibrary})")
            }
        } finally {
            zip.close()
        }
        logger.lifecycle("${jar.archivePath.name} contains ${localResource}")
    }
}
jar.finalizedBy checkLocalData

class CopyDataVisitor extends SimpleFileVisitor<Path> {
    def project

    CopyDataVisitor(prj) {
        project = prj
    }

    @Override
    public FileVisitResult preVisitDirectory(Path dir, BasicFileAttributes attrs) throws IOException {
        Path rel = project.dataSource.relativize(dir)
        if (rel.nameCount > 4) {
            rel = rel.subpath(4, rel.nameCount);
            if (rel.fileName.toString() == 'fastdebug') {
                // Do not copy fastdebug versions
                return FileVisitResult.SKIP_SUBTREE;
            }
            def targetPath = project.processedData.resolve(rel);
            if(!Files.exists(targetPath)){
                Files.createDirectory(targetPath);
            }
        }
        return FileVisitResult.CONTINUE;
    }
    @Override
    public FileVisitResult visitFile(Path file, BasicFileAttributes attrs) throws IOException {
        Path rel = project.dataSource.relativize(file)
        if (rel.nameCount > 4) {
            rel = rel.subpath(4, rel.nameCount);
            def targetPath = project.processedData.resolve(rel);
            Files.copy(file, targetPath, StandardCopyOption.REPLACE_EXISTING);
        }
        return FileVisitResult.CONTINUE;
    }
}
